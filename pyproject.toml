[project]
name = "roadwatch"
version = "1.0.0"
description = "Traffic anomaly detection and operations platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "python-multipart>=0.0.20,<1",
  "pillow>=11,<13", "httpx>=0.28,<1", "alembic>=1.14,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "isort>=6,<10", "ruff>=0.11,<1"]
ml = ["ultralytics>=8.3,<9", "opencv-python-headless>=4.10,<5"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.isort]
profile = "black"
line_length = 100
